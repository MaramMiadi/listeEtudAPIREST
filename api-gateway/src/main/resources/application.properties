# SERVER
server.port=8080

# SPRING APPLICATION
spring.application.name=api-gateway

# ========================
# SPRING CLOUD GATEWAY
# ========================

# CORS CONFIG
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# ROUTES
spring.cloud.gateway.routes[0].id=liste-etud-api
spring.cloud.gateway.routes[0].uri=lb://liste-etud-api
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/etudiants/**,/api/departements/**

spring.cloud.gateway.routes[1].id=grading-service
spring.cloud.gateway.routes[1].uri=lb://grading-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/notes/**

# DEFAULT FILTERS
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# ========================
# EUREKA CONFIG
# ========================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true