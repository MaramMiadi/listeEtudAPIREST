spring:
  application:
    name: liste-etud-api
  datasource:
    url: jdbc:postgresql://localhost:5432/etudiants_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  web:
    cors:
      allowed-origins: "*"

server:
  port: 8080